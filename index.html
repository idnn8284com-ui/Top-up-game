<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Top-Up Store</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kanit', sans-serif;
        }

        body {
            background-color: #08090d;
            background-image: radial-gradient(circle at 50% 10%, rgba(255, 0, 200, 0.15), rgba(0, 242, 255, 0.05) 50%, transparent 100%);
            color: #ffffff;
            padding-bottom: 60px;
            min-height: 100vh;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 17, 26, 0.85);
            backdrop-filter: blur(10px);
            padding: 14px 18px;
            border-bottom: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .badge-balance {
            background: rgba(255, 0, 200, 0.1);
            border: 1px solid #ff00c8;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            color: #00f2ff;
            box-shadow: 0 0 10px rgba(255, 0, 200, 0.3);
        }

        /* Hero Banner Cyber Circle */
        .hero-banner {
            margin: 15px;
            padding: 20px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(255, 0, 200, 0.2), rgba(0, 242, 255, 0.2));
            border: 1.5px solid #00f2ff;
            box-shadow: 0 0 20px rgba(0, 242, 255, 0.3), inset 0 0 15px rgba(255, 0, 200, 0.2);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,0,200,0.2) 10%, transparent 40%);
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hero-title {
            position: relative;
            font-size: 22px;
            font-weight: 600;
            background: linear-gradient(90deg, #00f2ff, #ff00c8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
        }

        .announcement {
            background: rgba(255, 0, 200, 0.15);
            border-y: 1px solid rgba(255, 0, 200, 0.3);
            color: #ffb3f3;
            padding: 8px 12px;
            font-size: 13px;
            box-shadow: inset 0 0 10px rgba(255, 0, 200, 0.2);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 20px 0 12px 0;
            color: #00f2ff;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 8px rgba(0, 242, 255, 0.6);
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .game-card {
            background: #121520;
            border-radius: 16px;
            padding: 8px;
            text-align: center;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 0, 200, 0.2);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .game-card:hover, .game-card.active {
            transform: translateY(-5px) scale(1.02);
            border-color: #00f2ff;
            box-shadow: 0 0 18px rgba(0, 242, 255, 0.6), 0 0 30px rgba(255, 0, 200, 0.4);
        }

        .game-card img {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            border-radius: 12px;
        }

        .game-title {
            font-size: 12px;
            margin-top: 8px;
            font-weight: 500;
            color: #ffffff;
        }

        .discount-tag {
            position: absolute;
            top: 4px;
            left: 4px;
            background: linear-gradient(135deg, #ff00c8, #7900ff);
            color: white;
            font-size: 9px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(255, 0, 200, 0.8);
        }

        /* Topup Form */
        .topup-form-card {
            background: rgba(18, 21, 32, 0.95);
            border-radius: 20px;
            padding: 22px;
            margin-top: 25px;
            border: 1px solid #ff00c8;
            box-shadow: 0 0 25px rgba(255, 0, 200, 0.25);
            display: none;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            margin-bottom: 8px;
            color: #00f2ff;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(0, 242, 255, 0.3);
            background-color: #0a0c12;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: #ff00c8;
            box-shadow: 0 0 10px rgba(255, 0, 200, 0.5);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #00f2ff, #ff00c8);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
            transition: 0.3s;
        }

        .btn-submit:hover {
            opacity: 0.9;
            box-shadow: 0 0 25px rgba(255, 0, 200, 0.8);
        }

        /* Floating Social Buttons */
        .floating-social {
            position: fixed;
            bottom: 20px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
            text-decoration: none;
            box-shadow: 0 0 12px rgba(0,0,0,0.6);
        }

        .btn-line { background-color: #06c755; box-shadow: 0 0 10px rgba(6, 199, 85, 0.5); }
        .btn-fb { background-color: #1877f2; box-shadow: 0 0 10px rgba(24, 119, 242, 0.5); }
    </style>
</head>
<body>

    <!-- Navbar -->
    <div class="navbar">
        <i class="fa-solid fa-bars" style="font-size: 20px; color: #00f2ff;"></i>
        <div class="badge-balance"><i class="fa-solid fa-wallet"></i> CREDIT: 0.00</div>
        <i class="fa-solid fa-circle-user" style="font-size: 24px; color: #ff00c8;"></i>
    </div>

    <!-- Announcement -->
    <div class="announcement">
        <marquee>⚡ ยินดีต้อนรับสู่ Cyber Top-Up บริการเติมเกมระบบอัตโนมัติ 24 ช.ม. ได้รับเพชรทันใจ ⚡</marquee>
    </div>

    <!-- Banner -->
    <div class="container">
        <div class="hero-banner">
            <div class="hero-title">⚡ CYBER GAME TOPUP ⚡</div>
            <p style="font-size: 12px; color: #a0a5c0; margin-top: 4px;">บริการเติมเกมออนไลน์ ราคาส่ง สแกนผ่าน QR Code</p>
        </div>

        <div class="section-title">
            <i class="fa-solid fa-fire" style="color: #ff00c8;"></i> เลือกเกมที่ต้องการเติม
        </div>

        <!-- Game Grid -->
        <div class="game-grid">
            <div class="game-card" onclick="selectGame('ROV')">
                <span class="discount-tag">ลด 23%</span>
                <img src="https://play-lh.googleusercontent.com/N_31V0HThYj1O4S2W70vN8J3R3-1_N_d6J6Xn-S6e22S" alt="ROV" onerror="this.src='https://via.placeholder.com/100/ff00c8/ffffff?text=ROV'">
                <div class="game-title">ROV</div>
            </div>
            <div class="game-card" onclick="selectGame('Free Fire')">
                <span class="discount-tag">ลด 26%</span>
                <img src="https://play-lh.googleusercontent.com/97y5eHIna2h1XJ9E-M9z6X1a-s_e5X3X" alt="Free Fire" onerror="this.src='https://via.placeholder.com/100/00f2ff/ffffff?text=FreeFire'">
                <div class="game-title">Free Fire</div>
            </div>
            <div class="game-card" onclick="selectGame('Roblox')">
                <span class="discount-tag">ลด 30%</span>
                <img src="https://play-lh.googleusercontent.com/WNW_L22Z11I_V1y2c771122" alt="Roblox" onerror="this.src='https://via.placeholder.com/100/ff00c8/ffffff?text=Roblox'">
                <div class="game-title">Roblox</div>
            </div>
            <div class="game-card" onclick="selectGame('PUBG Mobile')">
                <span class="discount-tag">ลด 15%</span>
                <img src="https://play-lh.googleusercontent.com/JRd05v04CDP37-188" alt="PUBG" onerror="this.src='https://via.placeholder.com/100/00f2ff/ffffff?text=PUBG'">
                <div class="game-title">PUBG</div>
            </div>
        </div>

        <!-- Top-up Form -->
        <div class="topup-form-card" id="topupForm">
            <h3 style="margin-bottom: 16px; color: #00f2ff; text-align: center;" id="selectedGameName">เติมเกม</h3>
            
            <div class="form-group">
                <label>UID / ID ตัวละคร:</label>
                <input type="text" class="form-control" placeholder="กรอก UID ของคุณ">
            </div>

            <div class="form-group">
                <label>เลือกแพ็กเกจเติมเกม:</label>
                <select class="form-control">
                    <option>50 เพชร / คูปอง - 15 บาท</option>
                    <option>150 เพชร / คูปอง - 45 บาท</option>
                    <option>500 เพชร / คูปอง - 140 บาท</option>
                    <option>1,000 เพชร / คูปอง - 270 บาท</option>
                </select>
            </div>

            <div class="form-group">
                <label>แนบรูปภาพสลิปโอนเงิน:</label>
                <input type="file" class="form-control" accept="image/*">
            </div>

            <button class="btn-submit" onclick="alert('ส่งข้อมูลการเติมเงินเรียบร้อยแล้ว!')">ยืนยันการเติมเงิน</button>
        </div>
    </div>

    <!-- Floating Social -->
    <div class="floating-social">
        <a href="#" class="social-btn btn-line"><i class="fa-brands fa-line"></i></a>
        <a href="#" class="social-btn btn-fb"><i class="fa-brands fa-facebook-f"></i></a>
    </div>

    <script>
        function selectGame(name) {
            document.getElementById('topupForm').style.display = 'block';
            document.getElementById('selectedGameName').innerText = 'เติมเกม ' + name;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }
    </script>
</body>
</html>
